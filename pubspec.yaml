name: circuit_breaker
description: A library for async retry, circuit breaker, request hedging, and adaptive throttling.
version: 0.1.0
repository: https://github.com/sigurdm/circuit_breaker
issue_tracker: https://github.com/sigurdm/circuit_breaker/issues
topics:
  - resilience
  - circuit-breaker
  - retry
  - throttling
  - hedging

environment:
  sdk: '>=3.11.0-0 <4.0.0'

dependencies:
  clock: ^1.1.1
  meta: ^1.11.0

dev_dependencies:
  fake_async: ^1.3.1
  lints: ^5.0.0
  test: ^1.24.0
